apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: carelink-kube-prometheus-stack
  namespace: argocd
spec:
  project: observability

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 69.3.2
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/observability/values/kube-prometheus-stack/base.yaml
          - $values/observability/values/kube-prometheus-stack/staging.yaml

    - repoURL: https://github.com/jacksonlskit/capstone-carelink-infra.git
      targetRevision: feature/observability-gitops
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:

name: Observability Configuration Validation

on:
  pull_request:
    paths:
      - ".github/workflows/observability-validate.yaml"
      - "observability/alerting/rules/**"
      - "observability/alerting-production/rules/**"
      - "observability/dashboards/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/observability-validate.yaml"
      - "observability/alerting/rules/**"
      - "observability/alerting-production/rules/**"
      - "observability/dashboards/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-prometheus-rules:
    name: Validate Prometheus Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3

      - name: Validate Prometheus rule files
        shell: bash
        run: |
          mapfile -d '' files < <(
            find observability/alerting/rules observability/alerting-production/rules -type f \
              \( -name '*.yaml' -o -name '*.yml' \) -print0
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No Prometheus rule files found. Skipping."
            exit 0
          fi

          temp_files=()
          trap 'rm -f "${temp_files[@]}"' EXIT

          for file in "${files[@]}"; do
            echo "Preparing $file for promtool validation"

            tmpfile=$(mktemp "$RUNNER_TEMP/prometheus-rules-XXXXXX.yaml")
            temp_files+=("$tmpfile")

            python - "$file" "$tmpfile" <<'PY'
          import sys
          import yaml

          source, destination = sys.argv[1:3]

          with open(source) as f:
              document = yaml.safe_load(f)

          if not isinstance(document, dict):
              raise SystemExit(f"{source}: expected a YAML object")

          groups = document.get("spec", {}).get("groups")

          if not isinstance(groups, list) or not groups:
              raise SystemExit(f"{source}: spec.groups is missing or empty")

          with open(destination, "w") as f:
              yaml.safe_dump({"groups": groups}, f, sort_keys=False)
          PY

            chmod 644 "$tmpfile"

            echo "Validating $file"
            docker run --rm \
              -v "$tmpfile:/tmp/rules.yaml:ro" \
              --entrypoint=promtool \
              prom/prometheus:v3.5.0 \
              check rules /tmp/rules.yaml
          done

          echo "All Prometheus rule files passed validation."

  validate-grafana-dashboards:
    name: Validate Grafana Dashboards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate dashboard JSON files
        shell: bash
        run: |
          if [ -d observability/dashboards ]; then
            mapfile -d '' files < <(
              find observability/dashboards -type f \
                -name '*.json' -print0
            )
          else
            files=()
          fi

          if [ ${#files[@]} -eq 0 ]; then
            echo "No Grafana dashboard JSON files found. Skipping."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Validating $file"
            python3 -m json.tool "$file" > /dev/null
          done

          echo "Grafana dashboard JSON validation passed."

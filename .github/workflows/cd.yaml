name: "Terraform CD (Deploy to Environments)"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Pre-deployment Security Gate (Runs at root to read .snyk file)
  # ---------------------------------------------------------------------------
  snyk-scan:
    name: "Snyk Pre-Deployment Security Check"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Snyk IaC Test
        uses: snyk/actions/iac@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          file: "."
          args: --severity-threshold=high

  # ---------------------------------------------------------------------------
  # Staging Deployment
  # ---------------------------------------------------------------------------
  apply-staging:
    name: "Deploy to Staging"
    runs-on: ubuntu-latest
    timeout-minutes: 45 # Apply requires headroom for EKS and RDS creation times
    needs: snyk-scan
    environment: staging

    defaults:
      run:
        working-directory: ./infra

    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Staging)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false # the wrapper adds lines to stdout, which breaks `terraform show -json > file`

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      # The nightly cleanup deletes the state file but keeps most tagged
      # resources. If the state is empty, this writes import blocks for what
      # still exists, so the apply adopts it instead of creating duplicates.
      - name: Recover state if the nightly cleanup deleted it
        run: ../scripts/recover-state.sh staging

      - name: Terraform Apply
        run: terraform apply -input=false -var="environment=staging" -auto-approve -no-color

  # ---------------------------------------------------------------------------
  # Production Deployment (Requires Manual UI Approval)
  # ---------------------------------------------------------------------------
  apply-production:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: apply-staging
    environment: production  # Pauses run until approved in GitHub UI

    defaults:
      run:
        working-directory: ./infra

    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Production)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false # the wrapper adds lines to stdout, which breaks `terraform show -json > file`

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Recover state if the nightly cleanup deleted it
        run: ../scripts/recover-state.sh production

      - name: Terraform Apply
        run: terraform apply -input=false -var="environment=production" -auto-approve -no-color

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: carelink-dashboards
  namespace: argocd
spec:
  project: observability

  source:
    repoURL: https://github.com/jacksonlskit/capstone-carelink-infra.git
    targetRevision: main
    path: observability/dashboards
    directory:
      recurse: true
      include: "*.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

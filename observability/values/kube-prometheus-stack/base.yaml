grafana:
  enabled: true
  persistence:
    enabled: true
    type: pvc
    size: 10Gi
    storageClassName: gp2

prometheus:
  enabled: true
  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    retention: 120h

defaultRules:
  create: true

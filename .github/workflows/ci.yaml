name: "Terraform CI (PR Verification)"

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Required for GitHub OIDC token generation
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Linting and Format Checking
  # ---------------------------------------------------------------------------
  lint:
    name: "Terraform Lint & Validate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Check Formatting
        run: terraform fmt -check

  # ---------------------------------------------------------------------------
  # Snyk Security Scan
  # ---------------------------------------------------------------------------
  snyk-scan:
    name: "Snyk IaC Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Snyk IaC Test
        uses: snyk/actions/iac@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          file: "."
          args: --severity-threshold=high

  # ---------------------------------------------------------------------------
  # Staging Plan with OIDC Token Inspector
  # ---------------------------------------------------------------------------
  plan-staging:
    name: "Terraform Plan (staging)"
    runs-on: ubuntu-latest
    needs: [lint, snyk-scan]
    environment: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # DIAGNOSTIC STEP: Prints the exact JSON payload GitHub sends to AWS STS
      # -----------------------------------------------------------------------
      - name: Inspect GitHub OIDC Token
        run: |
          echo "=== Requesting OIDC Token from GitHub Runner ==="
          RAW_TOKEN=$(curl -sLS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            -H "User-Agent: actions/runner" \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value')
          
          echo "=== Decoded OIDC Token Claims ==="
          jq -R 'split(".") | .[1] | @base64d | fromjson' <<< "$RAW_TOKEN"

      - name: Configure AWS Credentials (Staging)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform Plan
        run: terraform plan -no-color

  # ---------------------------------------------------------------------------
  # Production Plan
  # ---------------------------------------------------------------------------
  plan-production:
    name: "Terraform Plan (production)"
    runs-on: ubuntu-latest
    needs: [lint, snyk-scan]
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Production)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform Plan
        run: terraform plan -no-color

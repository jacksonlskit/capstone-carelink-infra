apiVersion: v1
kind: ConfigMap
metadata:
  name: infracost-exporter-nginx
  namespace: monitoring
data:
  default.conf: |
    server {
      listen 80;
      location = /metrics {
        root /usr/share/nginx/html;
        default_type "text/plain; version=0.0.4; charset=utf-8";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infracost-exporter
  namespace: monitoring
  labels:
    app: infracost-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infracost-exporter
  template:
    metadata:
      labels:
        app: infracost-exporter
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - name: http-metrics
              containerPort: 80
          volumeMounts:
            - name: metrics-vol
              mountPath: /usr/share/nginx/html/metrics
              subPath: metrics
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: metrics-vol
          configMap:
            name: infracost-metrics
        - name: nginx-conf
          configMap:
            name: infracost-exporter-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: infracost-exporter
  namespace: monitoring
  labels:
    app: infracost-exporter
spec:
  selector:
    app: infracost-exporter
  ports:
    - name: http-metrics
      port: 8080
      targetPort: 80
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: infracost-exporter
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: infracost-exporter
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s

# Serves the Infracost metrics (01-infracost-metrics-cm.yaml) at /metrics for
# Prometheus. Edited by hand (not generated). The image is pinned by version
# and digest so an upstream change cannot alter what runs, and it runs as a
# non-root user with a read-only root filesystem.
apiVersion: v1
kind: ConfigMap
metadata:
  name: infracost-exporter-nginx
  namespace: monitoring
data:
  default.conf: |
    server {
      listen 8080;
      location = /metrics {
        root /usr/share/nginx/html/finops;
        default_type "text/plain; version=0.0.4; charset=utf-8";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infracost-exporter
  namespace: monitoring
  labels:
    app: infracost-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infracost-exporter
  template:
    metadata:
      labels:
        app: infracost-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # nginx stable line (1.30), unprivileged build: listens on 8080 and
          # keeps its pid and temp files in /tmp.
          image: nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
          ports:
            - name: http-metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /metrics
              port: http-metrics
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Mounted as a directory, not with subPath: the kubelet only updates
            # directory mounts, so a new 01-infracost-metrics-cm.yaml reaches
            # /metrics within about a minute without restarting the pod.
            - name: metrics-vol
              mountPath: /usr/share/nginx/html/finops
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: metrics-vol
          configMap:
            name: infracost-metrics
        - name: nginx-conf
          configMap:
            name: infracost-exporter-nginx
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: infracost-exporter
  namespace: monitoring
  labels:
    app: infracost-exporter
spec:
  selector:
    app: infracost-exporter
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: infracost-exporter
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: infracost-exporter
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s

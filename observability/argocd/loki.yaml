apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: carelink-loki
  namespace: argocd
spec:
  project: observability

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.24.0
      helm:
        valueFiles:
          - $values/observability/values/loki/base.yaml
          - $values/observability/values/loki/staging.yaml

    - repoURL: https://github.com/jacksonlskit/capstone-carelink-infra.git
      targetRevision: feature/observability-gitops
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: carelink-dashboards
  namespace: argocd
spec:
  project: observability

  source:
    repoURL: https://github.com
    targetRevision: main
    path: observability/dashboards
    directory:
      recurse: true
      include: "*.yaml"

  destination:
    server: https://default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: carelink-grafana-secret
  namespace: argocd
spec:
  project: observability

  source:
    repoURL: https://github.com/jacksonlskit/capstone-carelink-infra.git
    targetRevision: feature/observability-gitops
    path: observability/secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: carelink-observability
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/jacksonlskit/capstone-carelink-infra.git
    targetRevision: feature/observability-gitops
    path: observability/argocd

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: s3
    s3:
      region: us-east-1

  limits_config:
    retention_period: 168h

  compactor:
    retention_enabled: true
    delete_request_store: s3

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi
    storageClass: gp2

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

minio:
  enabled: false


chunksCache:
  enabled: false

serviceAccount:
  create: true
  name: loki

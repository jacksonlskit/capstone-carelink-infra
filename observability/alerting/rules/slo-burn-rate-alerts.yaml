apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: carelink-slo-burn-rate-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: carelink.staging.slo-burn-rate
      interval: 30s
      rules:
        - alert: CareLinkStagingFastBurn
          expr: |
            sum_over_time(
              (
                (
                  avg_over_time(
                    carelink:staging:probe_failure:ratio[5m]
                  )
                ) > bool 0.0144
              )[25m:5m]
            ) >= 4
          labels:
            severity: page
            environment: staging
            service: carelink
          annotations:
            summary: "CareLink staging synthetic availability is experiencing fast error-budget burn"
            description: "The synthetic probe error rate exceeded 1.44% in at least 4 of the last 6 five-minute evaluations across continuous monitoring. Check the ALB and CareLink services. The authoritative request-based SLO alarm remains in CloudWatch."

        - alert: CareLinkStagingSlowBurn
          expr: |
            sum_over_time(
              (
                (
                  avg_over_time(
                    carelink:staging:probe_failure:ratio[1h]
                  )
                ) > bool 0.006
              )[5h:1h]
            ) >= 5
          labels:
            severity: ticket
            environment: staging
            service: carelink
          annotations:
            summary: "CareLink staging synthetic availability is experiencing slow error-budget burn"
            description: "The synthetic probe error rate exceeded 0.6% in at least 5 of the last 6 one-hour evaluations across continuous monitoring. Investigate recurring endpoint failures."

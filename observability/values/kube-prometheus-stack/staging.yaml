grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://carelink-loki.monitoring.svc.cluster.local:3100
      isDefault: false

prometheus:
  prometheusSpec:
    externalLabels:
      environment: staging
      project: carelink

# GitHub sign-in for Grafana (ADR 0011). Source: Secrets Manager
# carelink-production-grafana-github-oauth (infra/observability-grafana.tf), value
# stored by hand with scripts/set-argocd-oauth-secret.sh production grafana.
# Grafana reads these as environment variables (envFromSecrets in
# observability/values/kube-prometheus-stack/production.yaml). GF_AUTH_GITHUB_ENABLED
# is here on purpose: GitHub sign-in turns on only once the credentials exist.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-github-oauth
  namespace: monitoring
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-github-oauth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GF_AUTH_GITHUB_ENABLED: "true"
        GF_AUTH_GITHUB_CLIENT_ID: "{{ .clientID }}"
        GF_AUTH_GITHUB_CLIENT_SECRET: "{{ .clientSecret }}"
  data:
    - secretKey: clientID
      remoteRef:
        key: carelink-production-grafana-github-oauth
        property: clientID
    - secretKey: clientSecret
      remoteRef:
        key: carelink-production-grafana-github-oauth
        property: clientSecret

name: "Terraform CI (PR Verification)"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

permissions:
  id-token: write   # Required for GitHub OIDC token generation
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Linting and Format Checking
  # ---------------------------------------------------------------------------
  lint:
    name: "Terraform Lint & Validate"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./infra

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Check Formatting
        run: terraform fmt -check

      - name: Terraform Init (Validation only)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # ---------------------------------------------------------------------------
  # Snyk Security Scan (Runs at root to read .snyk file)
  # ---------------------------------------------------------------------------
  snyk-scan:
    name: "Snyk IaC Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Snyk IaC Test
        uses: snyk/actions/iac@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          file: "."
          args: --severity-threshold=high

  # ---------------------------------------------------------------------------
  # Staging Plan with OIDC Token Inspector
  # ---------------------------------------------------------------------------
  plan-staging:
    name: "Terraform Plan (staging)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, snyk-scan]
    environment: staging

    defaults:
      run:
        working-directory: ./infra

    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # DIAGNOSTIC STEP: Prints the exact JSON payload GitHub sends to AWS STS
      # -----------------------------------------------------------------------
      - name: Inspect GitHub OIDC Token
        run: |
          echo "=== Requesting OIDC Token from GitHub Runner ==="
          RAW_TOKEN=$(curl -sLS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            -H "User-Agent: actions/runner" \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value')
          
          echo "=== Decoded OIDC Token Claims ==="
          jq -R 'split(".") | .[1] | @base64d | fromjson' <<< "$RAW_TOKEN"

      - name: Configure AWS Credentials (Staging)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      # Read-only here: it only writes infra/imports.auto.tf on the runner so
      # the plan below shows what the deploy would import (see cd.yaml).
      - name: Recover state if the nightly cleanup deleted it
        run: ../scripts/recover-state.sh staging

      - name: Terraform Plan
        run: terraform plan -input=false -var="environment=staging" -no-color

  # ---------------------------------------------------------------------------
  # Production Plan
  # ---------------------------------------------------------------------------
  plan-production:
    name: "Terraform Plan (production)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, snyk-scan]
    environment: production

    defaults:
      run:
        working-directory: ./infra

    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Production)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Recover state if the nightly cleanup deleted it
        run: ../scripts/recover-state.sh production

      - name: Terraform Plan
        run: terraform plan -input=false -var="environment=production" -no-color
